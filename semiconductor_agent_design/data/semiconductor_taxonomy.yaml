    longevity:
      - 1y / 3y / 5y / 10y 모두 구분
      - 수요가 구조적인지 일시적인지 분리해서 설명
      - 대체 기술과 전환 시점을 함께 언급
    bottleneck:
      - 병목인지 아닌지를 명시
