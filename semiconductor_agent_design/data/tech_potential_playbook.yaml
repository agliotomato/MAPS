good_answer_criteria:
  longevity:
    - 1y / 3y / 5y / 10y 모두 구분해 답한다.
    - 수요가 구조적인지 일시적인지 분리해서 설명한다.
    - 대체 기술과 전환 시점을 함께 언급한다.
  bottleneck:
    - 병목인지 아닌지를 먼저 선언한다.
    - 대체 가능성과 공급 제약을 따로 본다.
    - 병목이면 산업 전체 영향까지 연결한다.
  company_impact:
    - 수혜 / 위협 / 중립을 분리한다.
    - 삼성, SK하이닉스, TSMC, ASML 같은 핵심 기업을 우선 본다.
    - 회사별 구조적 이유를 제시한다.
  evidence_quality:
    - 공식자료, 논문, 표준, 실적자료를 우선한다.
    - 단순 뉴스는 보조 근거로만 쓴다.
    - 근거가 약하면 모른다고 말하고 추가로 필요한 데이터를 제시한다.

questions:
  - category: market
    title: 이번 분기 DRAM/NAND 고정거래가 전분기 대비 얼마나 변했나?
    good_answer: 고정가 숫자와 전분기 대비 % 변화를 함께 제시한다.
  - category: demand
    title: HBM 수요는 어떤 AI 가속기 출하량에 직결되며, 현재 공급 타이트 구간인가?
    good_answer: HBM 다이 수 × GPU 출하대수로 수요량을 추정하고 공급사 캐파와 비교한다.
  - category: inventory
    title: PC·스마트폰 재고조정이 끝났다는 신호를 어떤 데이터에서 먼저 보는가?
    good_answer: 채널 재고 주수가 정상 범위로 복귀했는지 말한다.
  - category: capex
    title: AMAT·Lam Research 장비 수주잔고(Backlog)가 반도체 Capex의 몇 분기 선행지표인가?
    good_answer: backlog ÷ 매출로 선행 분기를 숫자로 근거 제시한다.
  - category: packaging
    title: CoWoS 패키징 캐파 병목이 해소되는 시점과 현재 대기 리드타임은?
    good_answer: 리드타임과 신규 캐파 증설 완료 예상 분기를 함께 말한다.
  - category: logic
    title: GAA와 FinFET의 차이가 실제 양산 원가와 전력 효율에 얼마나 영향을 주는가?
    good_answer: PPA와 수율, 양산 노드 전환 비용을 함께 설명한다.
  - category: equipment
    title: EUV/DUV 장비 수급이 선단 공정의 병목인지, 대체 가능한지 어떻게 판단하는가?
    good_answer: 장비 수요, 공급 제약, High-NA 도입 시점까지 함께 말한다.
  - category: memory
    title: DDR5, LPDDR5, HBM, NAND가 각기 다른 사이클을 타는 이유는 무엇인가?
    good_answer: 수요처와 재고 사이클, 가격 메커니즘을 분리해서 설명한다.
  - category: macro
    title: 반도체 수출입, 생산지수, Capex 지표가 한 방향으로 꺾일 때 무엇을 먼저 봐야 하는가?
    good_answer: 생산, 수출, 장비, 재고를 함께 묶어서 해석한다.

