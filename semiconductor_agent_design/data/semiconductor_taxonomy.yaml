analysis:
  evidence_priority:
    - official_ir
    - official_press_release
    - standard
    - earnings
    - paper
    - blog
    - news
  axis_spec:
    longevity:
      goal: "기술의 1y/3y/5y/10y 유효성 판단"
      high_signals:
        - "공식 IR/로드맵/표준문서에서 반복적으로 언급"
        - "수요가 여러 제품군/여러 세대에 걸쳐 지속"
        - "공정/패키징/표준 변경으로 대체가 어려움"
      low_signals:
        - "단일 이벤트성 뉴스에만 의존"
        - "단기 실험/논문 단계에 머무름"
        - "대체 기술이 이미 상용화 경로에 있음"
    bottleneck:
      goal: "해당 기술이 산업 병목인지 판정"
      high_signals:
        - "공급 제약/리드타임/캐파 부족/수율 문제가 반복"
        - "대체가 어렵고 single point of failure 성격이 강함"
        - "산업 전체의 성능/원가/출하를 제한"
      low_signals:
        - "여러 대체재가 있음"
        - "공급사와 공정 옵션이 충분"
        - "단순 성능 개선 요소이지 구조적 병목은 아님"
    company_impact:
      goal: "삼성/SK하이닉스/TSMC/ASML/AMAT/Lam/NVDA 등의 수혜/위협/중립 판정"
      rules:
        - "공식 자료와 실제 공급망 연결이 있는 회사를 우선"
        - "수혜/위협/중립을 하나만 고르지 말고 복수 회사에 대해 분리"
        - "왜 그 회사인지 물리적/사업적 경로를 반드시 설명"
    evidence_quality:
      goal: "판단의 근거가 얼마나 구조적인지 구분"
      grades:
        A: "공식자료 + 표준 + 실적자료 + 논문이 복수 축으로 교차"
        B: "공식자료/논문/실적자료 중 2개 이상 축이 충분"
        C: "논문 또는 뉴스 위주이며 보강 필요"
        D: "단일 뉴스/추론 위주로 신뢰도 낮음"
